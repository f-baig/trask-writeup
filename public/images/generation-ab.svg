<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Environment generation A/B results</title><desc id="desc">Grouped bars compare all-constraint and mean constraint satisfaction for three approaches over 81 trials.</desc>
  <rect width="1200" height="720" fill="#fff"/><text x="72" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#171717">Environment generation A/B</text><text x="72" y="98" font-family="Arial,sans-serif" font-size="16" fill="#666">81 trials · 9 briefs × 3 seeds × 3 approaches</text>
  <line x1="120" y1="560" x2="1120" y2="560" stroke="#aaa"/><line x1="120" y1="160" x2="120" y2="560" stroke="#aaa"/>
  <g stroke="#e5e5e5"><line x1="120" y1="460" x2="1120" y2="460"/><line x1="120" y1="360" x2="1120" y2="360"/><line x1="120" y1="260" x2="1120" y2="260"/><line x1="120" y1="160" x2="1120" y2="160"/></g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#666"><text x="82" y="566">0%</text><text x="72" y="466">25%</text><text x="72" y="366">50%</text><text x="72" y="266">75%</text><text x="64" y="166">100%</text></g>
  <rect x="210" y="441.6" width="90" height="118.4" fill="#858b91"/><rect x="306" y="256" width="90" height="304" fill="#c7cbd0"/><rect x="510" y="426.8" width="90" height="133.2" fill="#858b91"/><rect x="606" y="252.4" width="90" height="307.6" fill="#c7cbd0"/><rect x="810" y="263.6" width="90" height="296.4" fill="#2367d1"/><rect x="906" y="187.2" width="90" height="372.8" fill="#8bb5f5"/>
  <g font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#222"><text x="255" y="427">29.6%</text><text x="351" y="242">76.0%</text><text x="555" y="412">33.3%</text><text x="651" y="238">76.9%</text><text x="855" y="249">74.1%</text><text x="951" y="173">93.2%</text></g>
  <g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#222"><text x="303" y="600">One-shot</text><text x="603" y="600">Self-judge</text><text x="903" y="600" font-weight="700">Harness</text></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#444"><rect x="355" y="650" width="18" height="18" fill="#2367d1"/><text x="383" y="665">All constraints satisfied</text><rect x="625" y="650" width="18" height="18" fill="#8bb5f5"/><text x="653" y="665">Mean constraints satisfied</text></g>
