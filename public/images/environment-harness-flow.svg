<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" role="img" aria-labelledby="title desc">
  <title id="title">Environment-generation harness flow</title>
  <desc id="desc">A researcher brief is turned into a typed track plan by a model. Local code compiles and tests the scene. Failed checks return measured feedback for revision; passed checks produce a certified scene and report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53667a"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172435; }
      .subtitle { font: 400 21px Arial, Helvetica, sans-serif; fill: #607085; }
      .label { font: 700 26px Arial, Helvetica, sans-serif; fill: #172435; }
      .body { font: 400 20px Arial, Helvetica, sans-serif; fill: #526278; }
      .pill { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; }
      .arrow { fill: none; stroke: #53667a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="930" rx="28" fill="#fbfcfe"/>
  <text x="450" y="62" text-anchor="middle" class="title">From a brief to a certified world</text>
  <text x="450" y="96" text-anchor="middle" class="subtitle">The model handles intent; local code handles geometry and proof.</text>

  <rect x="155" y="135" width="590" height="112" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="184" y="155" width="91" height="28" rx="14" fill="#edf1f6"/>
  <text x="229.5" y="175" text-anchor="middle" class="pill" fill="#53667a">INPUT</text>
  <text x="184" y="211" class="label">Researcher brief</text>
  <text x="430" y="211" class="body">shape, surface, race behavior, constraints</text>

  <path d="M450 247 L450 287" class="arrow"/>

  <rect x="155" y="292" width="590" height="118" rx="20" fill="#eaf2ff" stroke="#6b9de8" stroke-width="2.5"/>
  <rect x="184" y="312" width="94" height="28" rx="14" fill="#d7e7ff"/>
  <text x="231" y="332" text-anchor="middle" class="pill" fill="#376bb4">MODEL</text>
  <text x="184" y="369" class="label">Author a typed TrackPlan</text>
  <text x="184" y="395" class="body">ordered corners + tunable scene parameters</text>

  <path d="M450 410 L450 450" class="arrow"/>

  <rect x="155" y="455" width="590" height="118" rx="20" fill="#eaf8f1" stroke="#62ad84" stroke-width="2.5"/>
  <rect x="184" y="475" width="135" height="28" rx="14" fill="#d5f0e1"/>
  <text x="251.5" y="495" text-anchor="middle" class="pill" fill="#2f7852">LOCAL CODE</text>
  <text x="184" y="532" class="label">Compile a playable circuit</text>
  <text x="184" y="558" class="body">close, fit, sample, place gates and barriers</text>

  <path d="M450 573 L450 613" class="arrow"/>

  <rect x="155" y="618" width="590" height="122" rx="20" fill="#fff6df" stroke="#dda94b" stroke-width="2.5"/>
  <rect x="184" y="638" width="135" height="28" rx="14" fill="#ffebbb"/>
  <text x="251.5" y="658" text-anchor="middle" class="pill" fill="#8a651d">LOCAL CODE</text>
  <text x="184" y="695" class="label">Measure and test drive</text>
  <text x="184" y="721" class="body">geometry checks + deterministic race probes</text>

  <path d="M450 740 L450 786" class="arrow"/>
  <rect x="407" y="754" width="86" height="28" rx="14" fill="#dff3e7"/>
  <text x="450" y="774" text-anchor="middle" class="pill" fill="#2f7852">PASS</text>

  <rect x="155" y="791" width="590" height="106" rx="20" fill="#e8f7ee" stroke="#40966a" stroke-width="3"/>
  <circle cx="208" cy="844" r="25" fill="#40966a"/>
  <path d="M196 844 l8 8 17 -19" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="838" class="label">Certified scene</text>
  <text x="250" y="866" class="body">playable environment + auditable TrackReport</text>

  <path d="M745 680 C840 680 840 351 760 351" class="arrow" stroke-dasharray="8 8"/>
  <rect x="735" y="471" width="150" height="90" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="810" y="498" text-anchor="middle" class="pill" fill="#a14f47">MISS</text>
  <text x="810" y="526" text-anchor="middle" class="body">measured</text>
  <text x="810" y="550" text-anchor="middle" class="body">feedback</text>
</svg>
